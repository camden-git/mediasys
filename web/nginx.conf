map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Keep the scheme reported by an upstream TLS-terminating proxy (only http/https
# are accepted); otherwise fall back to this connection's scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    http    http;
    https   https;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # compose's embedded DNS; re-resolve the backend so a recreated container
    # (new IP) doesn't leave nginx proxying to a stale address
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # uploads stream straight through to the backend
    client_max_body_size 0;
    proxy_request_buffering off;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # append so the chain from an outer proxy survives; the backend walks it
        # from the right and stops at the first hop outside TRUSTED_PROXIES, so
        # client-supplied entries are ignored
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # the backend only reads X-Forwarded-For; drop the spoofable alternatives
        proxy_set_header X-Real-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
