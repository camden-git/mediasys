name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # gocv (face detection/recognition) needs OpenCV 4's headers and libs at build
    # time, so the job runs inside the same OpenCV base image the production
    # Dockerfile builds against (see the `builder` stage in ./Dockerfile).
    container:
      image: ghcr.io/hybridgroup/opencv:4.11.0
      env:
        CGO_ENABLED: "1"
        GOTOOLCHAIN: local
        LD_LIBRARY_PATH: /usr/local/lib
        CGO_LDFLAGS: "-L/usr/local/lib -Wl,-rpath-link,/usr/local/lib"

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mediasys
          POSTGRES_PASSWORD: mediasys
          POSTGRES_DB: mediasys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediasys -d mediasys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # database/migrate_schema_test.go and ./e2e/... only run when these are set;
      # both point at throwaway resources scoped to this job.
      TEST_DATABASE_URL: postgres://mediasys:mediasys@postgres:5432/postgres?sslmode=disable
      TEST_S3_ENDPOINT: localhost:9000
      TEST_S3_ACCESS_KEY: mediasys
      TEST_S3_SECRET_KEY: change-me-please-in-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # MinIO can't be run as a GH Actions "services:" container (no way to pass
      # `server /data --console-address :9001` - services only support `image`,
      # `env`, `ports`, `volumes`, `options`, none of which override CMD), so it's
      # started here as a plain background process instead. Since it lives in the
      # job container's own network namespace, it's reachable at localhost:9000
      # without a separate service/network hop.
      - name: Start MinIO
        run: |
          curl -sSL https://dl.min.io/server/minio/release/linux-amd64/minio -o /usr/local/bin/minio
          chmod +x /usr/local/bin/minio
          MINIO_ROOT_USER="$TEST_S3_ACCESS_KEY" MINIO_ROOT_PASSWORD="$TEST_S3_SECRET_KEY" \
            /usr/local/bin/minio server /tmp/miniodata --address ":9000" --console-address ":9001" &
          timeout 60 bash -c 'until curl -fs http://localhost:9000/minio/health/live; do sleep 2; done'

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -timeout 5m

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: type-check
        run: ./node_modules/.bin/tsc -b

      # eslint is a hard failure here: as of this workflow being added, `pnpm lint`
      # is clean (0 errors - 2 pre-existing react-hooks/exhaustive-deps warnings,
      # which don't fail the run). If that regresses, either fix it or make this
      # step `continue-on-error: true` with a note on why.
      - name: lint
        run: ./node_modules/.bin/eslint .

      - name: build
        run: ./node_modules/.bin/vite build
