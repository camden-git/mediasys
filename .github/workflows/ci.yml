name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # gocv (face detection/recognition) needs OpenCV 4's headers and libs at build
    # time, so the job runs inside the same OpenCV base image the production
    # Dockerfile builds against (see the `builder` stage in ./Dockerfile).
    container:
      image: ghcr.io/hybridgroup/opencv:4.11.0
      env:
        CGO_ENABLED: "1"
        GOTOOLCHAIN: local
        LD_LIBRARY_PATH: /usr/local/lib
        CGO_LDFLAGS: "-L/usr/local/lib -Wl,-rpath-link,/usr/local/lib"

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mediasys
          POSTGRES_PASSWORD: mediasys
          POSTGRES_DB: mediasys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediasys -d mediasys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # the database schema tests and ./e2e/... need these (they fail, not skip, when
      # CI=true and these are missing); both point at throwaway resources scoped to this job.
      CI: "true"
      TEST_DATABASE_URL: postgres://mediasys:mediasys@postgres:5432/postgres?sslmode=disable
      TEST_S3_ENDPOINT: localhost:9000
      TEST_S3_ACCESS_KEY: mediasys
      TEST_S3_SECRET_KEY: change-me-please-in-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # latest 1.25.x patch (not the go.mod floor) so govulncheck sees a patched stdlib
          go-version: "1.25"
          check-latest: true
          cache: true

      # The MinIO-compatible store can't be a `services:` container (services can't
      # override CMD, and it needs `server /data`), so it's started with `docker run`
      # using the same pinned image as docker-compose.yml. The job container has the
      # host's docker socket mounted; `--network container:` shares this container's
      # network namespace, so the store is reachable at localhost:9000.
      - name: Start object storage
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz \
            | tar -xz --strip-components=1 -C /usr/local/bin docker/docker
          docker run -d --name storage --network "container:$(hostname)" \
            -e MINIO_ROOT_USER="$TEST_S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$TEST_S3_SECRET_KEY" \
            pgsty/silo:RELEASE.2026-09-16T00-00-00Z server /data --console-address ":9001"
          timeout 60 bash -c 'until curl -fs http://localhost:9000/minio/health/live; do sleep 2; done' \
            || { docker logs storage; exit 1; }

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: go test
        run: go test -race ./... -timeout 10m

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: prettier
        run: ./node_modules/.bin/prettier --check src

      - name: type-check
        run: ./node_modules/.bin/tsc -b

      # eslint is a hard failure here: as of this workflow being added, `pnpm lint`
      # is clean (0 errors - 2 pre-existing react-hooks/exhaustive-deps warnings,
      # which don't fail the run). If that regresses, either fix it or make this
      # step `continue-on-error: true` with a note on why.
      - name: lint
        run: ./node_modules/.bin/eslint .

      - name: build
        run: ./node_modules/.bin/vite build
