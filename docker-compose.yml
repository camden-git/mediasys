name: mediasys

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediasys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediasys}
      POSTGRES_DB: ${POSTGRES_DB:-mediasys}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # community-maintained MinIO fork (upstream MinIO is archived)
  storage:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-mediasys}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env (see .env.example)}
    volumes:
      - storage-data:/data
    ports:
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      args:
        OPENCV_IMAGE: ${OPENCV_IMAGE:-ghcr.io/hybridgroup/opencv:4.11.0}
    image: mediasys-backend:local
    restart: unless-stopped
    logging: *default-logging
    # lets in-flight uploads/downloads and workers finish (server shutdown timeout is 25s)
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mediasys}:${POSTGRES_PASSWORD:-mediasys}@postgres:5432/${POSTGRES_DB:-mediasys}?sslmode=disable
      S3_ENDPOINT: storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mediasys}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env (see .env.example)}
      S3_BUCKET: ${S3_BUCKET:-mediasys}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: "false"
      PORT: "8080"
      DATABASE_DEBUG: ${DATABASE_DEBUG:-false}
      # required: the server refuses to start without a real secret of 32+ characters
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ characters) in .env (see .env.example) (openssl rand -hex 32 makes one)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
      PUBLIC_URL: ${PUBLIC_URL:-}
      FACE_RECOGNITION_ENABLED: ${FACE_RECOGNITION_ENABLED:-true}
      FACE_RECOGNITION_MODEL_NAME: ${FACE_RECOGNITION_MODEL_NAME:-arcface}
      FACE_RECOGNITION_THRESHOLD: ${FACE_RECOGNITION_THRESHOLD:-0.6}
      CUDA_ENABLED: ${CUDA_ENABLED:-false}
      RETINAFACE_CUDA: ${RETINAFACE_CUDA:-false}
      ARCFACE_CUDA: ${ARCFACE_CUDA:-false}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-200}
      THUMBNAIL_MAX_SIZE: ${THUMBNAIL_MAX_SIZE:-300}
      THUMBNAIL_QUEUE_SIZE: ${THUMBNAIL_QUEUE_SIZE:-50}
      NUM_THUMBNAIL_WORKERS: ${NUM_THUMBNAIL_WORKERS:-2}
      NUM_DETECTION_WORKERS: ${NUM_DETECTION_WORKERS:-1}
      DETECTION_QUEUE_SIZE: ${DETECTION_QUEUE_SIZE:-10}
      # 0 disables the periodic memory trimmer
      MEMORY_TRIM_INTERVAL_MINUTES: ${MEMORY_TRIM_INTERVAL_MINUTES:-30}
      # soft memory limit read by the Go runtime, e.g. 2GiB (unset = no limit)
      GOMEMLIMIT: ${GOMEMLIMIT:-}
    volumes:
      # face detection / recognition model files (read-only)
      - ${MODELS_DIR:-./ml-models}:/models:ro
    # Uncomment for NVIDIA GPUs (also build with a CUDA-enabled OPENCV_IMAGE)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: ["gpu"]

  web:
    build:
      context: ./web
      args:
        VITE_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    image: mediasys-web:local
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  storage-data:
